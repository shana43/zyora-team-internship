<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header>
    <h1>DevFolio</h1>

    <nav>
        <button id="themeBtn">🌙 Dark Mode</button>

        <a href="../index.html">Home</a>
        <a href="about.html">About</a>
        <a href="builder.html">Builder</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>

<section class="hero-about">
    <div class="hero-content">
        <h1>Contact Us</h1>
        <p>Have a question or want to collaborate? We'd love to hear from you.</p>
    </div>
</section>

<section class="cards">

<div class="card">

<h2>📧 Email</h2>

<p>your@email.com</p>

</div>

<div class="card">

<h2>💻 GitHub</h2>

<p>github.com/yourusername</p>

</div>

<div class="card">

<h2>🌐 LinkedIn</h2>

<p>linkedin.com/in/yourprofile</p>

</div>

</section>

<section class="about-card">

<h2>Send a Message</h2>

<form id="contactForm">

<label>Name</label>

<input type="text" id="name" placeholder="Enter your name" required>

<label>Email</label>

<input type="email" id="email" placeholder="Enter your email" required>

<label>Message</label>

<textarea id="message" rows="5" placeholder="Write your message"></textarea>

<button type="submit" class="btn">Send Message</button>

</form>

</section>

</main>

<footer>
    <p>© 2026 DevFolio. All Rights Reserved.</p>
</footer>

<script src="../js/script.js"></script>
</body>
</html>

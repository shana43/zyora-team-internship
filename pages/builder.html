<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Builder</title>

    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
    <h1>Portfolio Builder</h1>

    <nav>
        <a href="../index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>
    <h2>Create Your Portfolio</h2>

    <form id="builderForm">

        <label>Full Name</label><br>
        <input type="text" id="fullName" placeholder="Enter your name"><br><br>

        <label>Profession</label><br>
        <input type="text" id="profession" placeholder="Software Developer"><br><br>

        <label>Email</label><br>
        <input type="email" id="builderEmail" placeholder="example@email.com"><br><br>

        <label>About Me</label><br>
        <textarea id="about" rows="5" placeholder="Write about yourself"></textarea><br><br>

        <label>Skills</label><br>
        <input type="text" id="skills" placeholder="HTML, CSS, JavaScript"><br><br>

        <label>Projects</label><br>
        <textarea id="projects" rows="4" placeholder="Describe your projects"></textarea><br><br>

        <button type="submit">Generate Portfolio</button>

    </form>
</main>

<footer>
    <a href="../index.html">Home</a>
</footer>

<script src="../js/builder.js"></script>

</body>
</html>
